<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNAP Agent - School Nutrition AI Purchasing Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.png" alt="SNAP Agent" class="header-logo">
    </div>

    <div class="section">
      <button id="scanBtn" class="btn-primary">Scan Order</button>
      <button id="menuBtn" class="btn-secondary">Show Menu for These Days</button>
      <div id="status" class="status"></div>
    </div>

    <div id="flags"></div>

    <div id="reminders"></div>

    <div class="footer">
      <p>Created by Anselmo Barrera for Houston ISD Nutrition Services.</p>
      <p>This is an internal pilot tool and is currently being tested for training purposes.</p>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
