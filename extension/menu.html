<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SNAP Agent - Menu for this order</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <header>
    <div>
      <h1 id="school">Loading&hellip;</h1>
      <div id="subtitle" class="subtitle"></div>
    </div>
    <button id="refreshBtn" class="btn">Refresh</button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="chooser" class="card" hidden>
    <h2>Which school is this?</h2>
    <p class="muted">The name on the order does not match the school list. Pick the right one and
      SNAP Agent will remember it.</p>
    <div id="chooserOptions" class="chooser-options"></div>
  </section>

  <section id="missingSection" class="card" hidden>
    <h2>Not seeing these on the order</h2>
    <p class="muted">Entrees and sides on the menu with no matching line on this order. Condiments
      are never checked.</p>
    <div id="missing"></div>
  </section>

  <section id="daysSection">
    <div id="days"></div>
  </section>

  <footer>
    <span id="dataSource" class="muted"></span>
  </footer>

  <script type="module" src="menu.js"></script>
</body>
</html>
